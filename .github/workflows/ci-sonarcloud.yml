name: CI & SonarCloud Quality Gate

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  analyze:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Verify Complexity Limits (CC <= 5)
        run: npm run lint:complexity

      - name: Execute Tests with Coverage
        run: npm run test:coverage

      - name: Build All Workspaces
        run: npm run build

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@ba3875ecf642b2129de2b589510c81a8b53dbf4e # v4/master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate Verification
        uses: SonarSource/sonarqube-quality-gate-action@3cfda8eca512232cb42bd40fd01567cba471db39 # v1/master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt

