sonar.projectKey=argentina_simulador_politico_2027
sonar.organization=estudio-y-proyectos
sonar.host.url=https://sonarcloud.io

# Directorios de analisis de los paquetes hexagonales
sonar.sources=packages/simulation-domain/src,packages/simulation-infrastructure/src,packages/web-presentation/src
sonar.tests=packages/simulation-domain/tests,packages/simulation-infrastructure/tests
sonar.sourceEncoding=UTF-8

# Exclusiones de archivos generados y dependencias
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts
sonar.coverage.exclusions=**/main.tsx,**/vite-env.d.ts,**/components/ui/**

# Reporte LCOV generado por Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
